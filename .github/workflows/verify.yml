name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 格式、规约、静态缺陷与测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  security:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::缺少 NVD_API_KEY secret。无 key 时 NVD 限速会导致扫描超时或被 429 拒绝，"
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置后重跑。"
            exit 1
          fi
      - name: Restore NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
      - name: mvn verify -Psecurity
        run: mvn -B verify -Psecurity
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
