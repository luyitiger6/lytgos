name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 格式、规约、静态缺陷与测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  security:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # NVD 数据走 NIST 官方 JSON feeds 2.0（生产端在 pom 的 nvdDatafeedUrl），无需 API key；
      # 只缓存 dataDirectory，年度包不变时按 meta 做增量更新。
      - name: Restore NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: nvd-feeds-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            nvd-feeds-${{ runner.os }}-
      - name: mvn verify -Psecurity
        run: mvn -B verify -Psecurity
