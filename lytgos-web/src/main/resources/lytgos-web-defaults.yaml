# lytgos Web 地基的共享配置。
# 各入口的 application.yaml 用 spring.config.import 引入本文件；
# 不直接叫 application.yaml，是因为同名文件在 classpath 上会互相遮蔽。
spring:
  threads:
    # JDK 21 虚拟线程承载 MVC 请求（验收判据见 /api/v1/system/info）
    virtual:
      enabled: true

server:
  # 默认只监听回环地址：把服务暴露到非回环网卡不属于本能力，
  # 需要时由使用者显式覆盖（serve 的命令行参数里再重复一次，命令行优先）。
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        # 只开放健康、信息与指标抓取；/actuator/env 等其余端点不暴露
        include: health,info,prometheus
  endpoint:
    health:
      # 匿名调用方不应看到依赖细节
      show-details: never
      # 供 K8s 区分「进程活着」与「可以接流量」
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # 根 pom 把 swagger-ui webjar 覆盖到 5.35.0（DOMPurify CVE 修复版），但 springdoc 3.2.0
    # 的资源处理器硬编码指向 webjars/swagger-ui/5.34.0 目录（不按 classpath 探测），不声明
    # 版本会让 /swagger-ui/** 全部 404。两处版本必须同步：升级 swagger-ui 时同时改根 pom 与这里。
    version: 5.35.0

logging:
  # Spring Boot 4 不会从依赖 jar 自动发现 logback-spring.xml，必须显式指路；
  # 写在这里两个入口一次生效（文件随 lytgos-web 打进各自的 fat jar）。
  config: classpath:logback-spring.xml

---
# prod 只关调试页面，保留 /v3/api-docs 供网关与客户导入契约
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
